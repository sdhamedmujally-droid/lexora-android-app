name: Build Lexora Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons from SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density=$(echo $item | cut -d: -f1)
            size=$(echo $item | cut -d: -f2)
            target="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            rsvg-convert -w "$size" -h "$size" www/icon.svg -o "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_foreground.png"
          done

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Lexora-English-Lab.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexora-English-Lab-APK
          path: release-output/Lexora-English-Lab.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Lexora English Lab v1.0.${{ github.run_number }}"
          files: release-output/Lexora-English-Lab.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
